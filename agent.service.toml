alias = "runner-watch"
restart = "always"
enabled = true
working-directory = "__DIR__"

[units.app]
isolate = "__DIR__/agent.js"
args = ["--name", "__NAME__", "--interval", "1000"]

[units.metrics]
isolate = "__DIR__/metrics.js"
lazy = true
args = ["--name", "__NAME__"]

[units.web]
web-server = "http://0.0.0.0:__PORT__/"

[units.web.routes."/tty"]
target = "app"
description = "runner status frames"

[units.web.routes."/metrics"]
target = "metrics"
portal = "console"
tenancy = "per-connection"
description = "prometheus exposition, one scrape per request"

[units.llms]
isolate = "__DIR__/llms.js"
lazy = true
args = ["--name", "__NAME__"]

[units.web.routes."/llms.txt"]
target = "llms"
portal = "console"
tenancy = "per-connection"
description = "plain-text snapshot for agents, one sample per request"
