<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner Watch</title>
<link rel="icon" type="image/png" href="yeet.png">
<style>
  :root {
    color-scheme: dark;
    --surface: #000000; --card: #0b0b0d; --card-2: #141416; --line: #2a2a2d; --line-2: #1c1c1e;
    --ink: #e8e6df; --ink-2: #b8b6ae; --ink-3: #8b8b8b; --ink-4: #6e6e6e;
    --yellow: #ffe500; --yellow-dim: rgba(255,229,0,0.14); --track: #1e1e21;
    --good: #28c840; --warn: #febc2e; --critical: #ff5f57;
    --busy: var(--yellow); --idle: var(--good); --off: #6e6e6e;
    --mono: Iosevka, "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); color: var(--ink); font: 14px/1.45 var(--sans); }
  body { padding: 22px 16px 56px; max-width: 1480px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 20px; }
  header .logo { display: block; height: 32px; width: auto; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  h1::before { content: "yeet"; color: var(--yellow); font-family: var(--mono); font-weight: 500; margin-right: 8px; }
  header .sub { color: var(--ink-3); font-size: 13px; font-family: var(--mono); }
  header .views { display: flex; border: 1px solid var(--line); font-family: var(--mono); font-size: 12px; }
  header .views button { background: none; border: 0; color: var(--ink-3); font: inherit; padding: 3px 10px; cursor: pointer; }
  header .views button.on { color: var(--surface); background: var(--yellow); }
  header .views button:not(.on):hover { color: var(--yellow); }
  header .links { margin-left: auto; display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; }
  .gantt { background: var(--card); border: 1px solid var(--line); padding: 12px 14px 10px; }
  .gantt .bar-top { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); }
  .gantt .bar-top .win { display: flex; border: 1px solid var(--line); }
  .gantt .bar-top .win button { background: none; border: 0; color: var(--ink-3); font: inherit; padding: 2px 8px; cursor: pointer; }
  .gantt .bar-top .win button.on { color: var(--surface); background: var(--yellow); }
  .gantt .legend { margin-left: auto; display: flex; gap: 14px; }
  .gantt .legend i { display: inline-block; width: 10px; height: 8px; margin-right: 5px; vertical-align: -1px; }
  .gantt svg { display: block; width: 100%; }
  .gantt .lane-bg:nth-child(even) { fill: var(--surface); }
  .gantt text { font-family: var(--mono); fill: var(--ink-2); font-size: 11px; }
  .gantt text.lane { fill: var(--ink); font-weight: 600; font-family: var(--sans); font-size: 12.5px; }
  .gantt text.lane.dim { fill: var(--ink-4); font-weight: 400; }
  .gantt text.tick { fill: var(--ink-4); font-size: 10.5px; }
  .gantt line.grid { stroke: var(--line-2); } .gantt line.now { stroke: var(--yellow); stroke-dasharray: 3 3; }
  .gantt rect.job { fill: #3a3a3e; } .gantt rect.job.live { fill: var(--yellow); animation: pulse 1.2s ease-in-out infinite; }
  .gantt rect.job.failed { fill: #5a2a2a; } .gantt rect.fail { fill: var(--critical); }
  .gantt line.step { stroke: var(--surface); stroke-opacity: .8; }
  .gantt text.lbl { fill: var(--ink); font-size: 10.5px; pointer-events: none; } .gantt text.lbl.onlive { fill: var(--surface); font-weight: 600; }
  .gantt a rect:hover { stroke: var(--ink); stroke-width: 1; }
  body.view-timeline .list, body.view-timeline details { display: none; }
  body.view-list .gantt { display: none; }
  header .links a { color: var(--ink-3); text-decoration: none; border-bottom: 1px solid var(--line); }
  header .links a:hover { color: var(--yellow); border-color: var(--yellow); }
  .num { font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .hatch { position: relative; z-index: 0; }
  .hatch::after { content: ""; position: absolute; inset: 6px -6px -6px 6px; z-index: -1;
    background: repeating-linear-gradient(135deg, var(--line) 0 1px, transparent 1px 5px); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .tile { background: var(--card); border: 1px solid var(--ink-3); padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto auto; column-gap: 10px; }
  .tile .k { grid-column: 1 / -1; }
  .tile .d { grid-column: 1 / -1; }
  .tile svg.spark { grid-column: 2; grid-row: 2; align-self: end; margin-bottom: 4px; }
  svg.spark { display: block; overflow: visible; }
  svg.spark .area { fill: var(--yellow); opacity: .14; }
  svg.spark .line { fill: none; stroke: var(--yellow); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  svg.spark .dot { fill: var(--yellow); }
  svg.spark.hot .line { stroke: var(--critical); } svg.spark.hot .area { fill: var(--critical); } svg.spark.hot .dot { fill: var(--critical); }
  svg.spark.dim .line { stroke: var(--ink-3); } svg.spark.dim .area { fill: var(--ink-3); } svg.spark.dim .dot { fill: var(--ink-3); }
  .tile .k { color: var(--yellow); font-size: 11.5px; font-family: var(--mono); letter-spacing: .04em; }
  .tile .v { font-size: 28px; font-weight: 500; margin-top: 2px; font-family: var(--mono); white-space: nowrap; }
  .tile .d { color: var(--ink-3); font-size: 12px; margin-top: 2px; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .cols, .row { display: grid; grid-template-columns: minmax(230px, 1.3fr) 130px 92px minmax(120px, 1fr) minmax(120px, 1fr) 56px minmax(220px, 2fr) 64px 48px 56px; gap: 12px; align-items: center; padding: 0 14px; }
  .cols { color: var(--ink-4); font-size: 11.5px; font-family: var(--mono); padding-bottom: 4px; }
  .node { background: var(--card); border: 1px solid var(--line); transition: none; }
  .node.off { opacity: .55; }
  .node:has(.chip.busy) { border-color: var(--ink-3); }
  .row { min-height: 52px; font-size: 13px; }
  .row .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .row .name small { color: var(--ink-4); font-weight: 400; font-size: 11.5px; font-family: var(--mono); flex-shrink: 0; }
  .row .r { text-align: right; }
  .row .job { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .job.none { color: var(--ink-4); }
  .row .job small { color: var(--ink-3); font-size: 11.5px; font-family: var(--mono); }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-family: var(--mono); padding: 2px 9px; border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .chip i { width: 7px; height: 7px; background: var(--off); display: inline-block; }
  .chip.busy { color: var(--yellow); border-color: var(--yellow); background: var(--yellow-dim); }
  .chip.busy i { background: var(--busy); animation: pulse 1.2s ease-in-out infinite; } .chip.idle i { background: var(--idle); }
  .chip.off i { background: var(--off); } .chip.stalled i { background: var(--warn); } .chip.norunner i { background: var(--critical); }
  .chip.ok i { background: var(--good); } .chip.warn { color: var(--warn); border-color: var(--warn); } .chip.warn i { background: var(--warn); }
  .chip.critical { color: var(--critical); border-color: var(--critical); } .chip.critical i { background: var(--critical); animation: pulse 1.2s ease-in-out infinite; }
  .node:has(.chip.critical) { border-color: var(--critical); }
  .reasons { margin: 0 0 4px; padding: 0; list-style: none; font-size: 12.5px; }
  .reasons li { display: flex; gap: 8px; align-items: baseline; color: var(--ink-2); }
  .reasons li::before { content: "■"; font-size: 8px; color: var(--warn); flex-shrink: 0; }
  .reasons li.critical::before { color: var(--critical); }
  .reasons li.ok::before { color: var(--good); }
  .reasons li.ok { color: var(--ink-3); }
  .panel .kv b.wait { white-space: normal; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
  .wait b { color: var(--ink); font-weight: 500; }
  .wait.running b { color: var(--good); } .wait.network b, .wait.connecting b { color: var(--warn); } .wait.disk b, .wait.zombie b, .wait.stopped b { color: var(--critical); }
  .procs li.D span:first-child { color: var(--critical); }
  .slow { color: var(--warn); }
  .meter { display: grid; grid-template-columns: 1fr 58px; gap: 2px 8px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .meter svg.spark { grid-column: 1; grid-row: 1; width: 100%; }
  .meter .bar { grid-column: 1; grid-row: 2; }
  .meter .num { grid-column: 2; grid-row: 1 / 3; }
  .loadcell { display: grid; grid-template-columns: 1fr; justify-items: end; gap: 1px; }
  .loadcell svg.spark { width: 100%; }
  .bar { height: 7px; background: var(--track); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--yellow); transition: width .4s ease; }
  .bar.hot > i { background: var(--critical); }
  .tog { background: none; border: 0; color: var(--ink-3); cursor: pointer; font: inherit; font-size: 11px; padding: 0 4px; }
  .tog::before { content: "▾"; display: inline-block; transition: transform .15s; }
  .tog:hover { color: var(--yellow); }
  .node.collapsed .tog::before { transform: rotate(-90deg); }
  .panel { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; font-size: 12.5px; }
  .node.collapsed .panel { display: none; }
  .panel h4 { margin: 0 0 6px; font-size: 11.5px; color: var(--yellow); font-family: var(--mono); font-weight: 500; letter-spacing: .04em; }
  .panel h4 a { text-transform: none; letter-spacing: 0; color: var(--yellow); }
  .panel .kv { display: grid; grid-template-columns: 90px 1fr; gap: 2px 10px; color: var(--ink-3); }
  .panel .kv b { color: var(--ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .procs { margin: 0; padding: 0; list-style: none; font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
  .procs li { display: grid; grid-template-columns: 76px 1fr 48px 64px; gap: 8px; }
  .procs li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .procs em { font-style: normal; color: var(--ink-4); }
  .hist div { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); }
  .steps { margin: 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-2); }
  .steps li { display: grid; grid-template-columns: 22px minmax(90px, 1fr) minmax(80px, 1.4fr) 52px; gap: 8px; align-items: center; min-height: 20px; }
  .steps .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .steps .tl { height: 6px; background: var(--track); overflow: hidden; }
  .steps .tl i { display: block; height: 100%; background: var(--ink-3); }
  .steps li.live .tl i { background: var(--yellow); animation: pulse 1.2s ease-in-out infinite; }
  .steps li.live .lbl { color: var(--yellow); font-weight: 500; }
  @keyframes pulse { 50% { opacity: .45; } }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--line); }
  a:hover { border-bottom-color: var(--yellow); color: var(--yellow); }
  .res { font-style: normal; display: inline-block; width: 14px; }
  .res.ok { color: var(--good); } .res.bad { color: var(--critical); } .res.skip { color: var(--ink-4); }
  .err { color: var(--critical); font-size: 12px; padding: 0 14px 8px; font-family: var(--mono); }
  table.tbl { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 13px; }
  table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line-2); }
  table.tbl th { color: var(--ink-4); font-weight: 500; font-size: 11.5px; font-family: var(--mono); }
  table.tbl td.num, table.tbl th.num { text-align: right; }
  details summary { cursor: pointer; color: var(--ink-3); font-size: 12.5px; font-family: var(--mono); margin-top: 26px; }
  details summary:hover { color: var(--yellow); }
  @media (max-width: 900px) {
    .cols { display: none; }
    .row { grid-template-columns: 1fr auto; row-gap: 6px; padding: 10px 14px; }
    .row > * { grid-column: span 2; } .row .name, .row .state { grid-column: span 1; }
    .row .r { text-align: left; }
    .panel { grid-template-columns: 1fr; }
    .hatch::after { display: none; }
  }
</style>
</head>
<body>
<header>
  <img class="logo" src="yeet.png" alt="yeet" width="34" height="32">
  <h1>runner-watch</h1>
  <span class="sub" id="sub">connecting…</span>
  <nav class="views" id="views"><button data-view="list">list</button><button data-view="timeline">timeline</button></nav>
  <nav class="links"><a href="llms.txt">llms.txt</a><a href=".well-known/yeet/manifest.json">manifest</a></nav>
</header>
<section class="tiles" id="tiles"></section>
<section class="gantt" id="gantt"></section>
<section class="list" id="list"><div class="cols"><span>runner</span><span>state</span><span>health</span><span>cpu</span><span>memory</span><span class="r">load</span><span>job</span><span class="r">elapsed</span><span class="r">done</span><span class="r">busy</span></div></section>
<details><summary>Table view</summary><table class="tbl" id="tbl"></table></details>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (x) => (x == null ? "–" : `${Math.round(x * 100)}%`);
  const gb = (b) => `${(b / 2 ** 30).toFixed(1)} GiB`;
  const dur = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); if (s >= 86400) return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`; if (s >= 3600) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`; if (s >= 60) return `${Math.floor(s / 60)}m ${s % 60}s`; return `${s}s`; };
  const ago = (ts) => `${dur(Date.now() - ts)} ago`;
  const natural = (a, b) => a.localeCompare(b, undefined, { numeric: true });

  // ---------------------------------------------------------------- runners
  // name -> { name, url, ws, frame, at, state: "connecting"|"live"|"off" }
  const runners = new Map();
  const STALL_MS = 5000;

  function state(r) {
    if (r.state !== "live") return r.state === "off" ? "off" : "connecting";
    // The socket opens before the first frame, and a dead upstream
    // may open and never send one.
    if (performance.now() - r.at > STALL_MS) return "stalled";
    if (!r.frame) return "connecting";
    if (!r.frame.runners.length) return "norunner";
    return r.frame.runners.some((x) => x.state === "busy") ? "busy" : "idle";
  }
  const LABEL = { off: "offline", connecting: "connecting", stalled: "stalled", norunner: "no runner process", busy: "busy", idle: "idle" };

  // ---------------------------------------------------------------- portal client
  const OSC_OPEN = "\x1b]7880;", OSC_CLOSE = "\x07";
  function framer(onFrame) {
    let pending = "";
    return (chunk) => {
      pending += chunk;
      for (;;) {
        const s = pending.indexOf(OSC_OPEN); if (s < 0) { pending = pending.slice(-OSC_OPEN.length); return; }
        const e = pending.indexOf(OSC_CLOSE, s); if (e < 0) { pending = pending.slice(s); return; }
        const body = pending.slice(s + OSC_OPEN.length, e); pending = pending.slice(e + OSC_CLOSE.length);
        try { onFrame(JSON.parse(body)); } catch { /* torn frame */ }
      }
    };
  }
  function dial(r, delay = 0) {
    setTimeout(() => {
      if (!r.reachable || r.ws) return;
      const ws = new WebSocket(r.url); ws.binaryType = "arraybuffer";
      const dec = new TextDecoder();
      const feed = framer((f) => { if (f.t === "tick") { r.frame = f; r.at = performance.now(); r.state = "live"; r.skew = Date.now() - f.ts; } });
      ws.onopen = () => { r.state = "live"; r.at = performance.now(); r.retry = 0; };
      ws.onmessage = (m) => feed(typeof m.data === "string" ? m.data : dec.decode(new Uint8Array(m.data), { stream: true }));
      ws.onclose = (ev) => { r.ws = null; r.state = "off"; r.closes = (r.closes ?? 0) + 1; r.lastClose = `${ev.code} ${ev.reason}`; r.retry = Math.min((r.retry ?? 0) + 1, 6); dial(r, 1000 * 2 ** r.retry); };
      ws.onerror = () => ws.close();
      r.ws = ws;
    }, delay);
  }
  function add(name, url, reachable) {
    const r = runners.get(name) ?? runners.set(name, { name, url, frame: null, at: 0, state: "off", retry: 0, reachable: false, ws: null }).get(name);
    if (reachable && !r.reachable) { r.reachable = true; r.state = "connecting"; r.retry = 0; dial(r); }
    else if (!reachable && r.reachable) { r.reachable = false; const ws = r.ws; r.ws = null; ws?.close(); r.state = "off"; }
  }

  // Runners come from, in order: `?runners=name=ws://…,name=ws://…`, the
  // hub's runners.json, then the hub's own route manifest. Only runners
  // the manifest lists are dialed: the hub answers an upgrade for a
  // runner it cannot reach only after its own dial gives up, and a
  // browser allows six pending handshakes per host, so a few dead
  // runners would otherwise hold the live ones in the queue. The rest
  // are listed as unreachable without a socket.
  const wsBase = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}`;
  async function discover() {
    const q = new URLSearchParams(location.search).get("runners");
    if (q) { for (const part of q.split(",")) { const [n, u] = part.split(/=(.*)/s); if (n && u) add(n, u, true); } return; }
    const listed = new Set();
    try {
      const res = await fetch("runners.json", { cache: "no-store" });
      if (res.ok) for (const n of await res.json()) listed.add(n);
    } catch { /* no list published */ }
    let reachable = null;
    try {
      const res = await fetch("/.well-known/yeet/manifest.json", { cache: "no-store" });
      if (res.ok) {
        reachable = new Set();
        for (const route of (await res.json()).routes ?? []) {
          const m = /^\/r\/([^/]+)\/tty$/.exec(route.path ?? "");
          if (m) reachable.add(decodeURIComponent(m[1]));
        }
      }
    } catch { /* no manifest */ }
    // Without a manifest, dial everything listed, as before.
    for (const n of new Set([...listed, ...(reachable ?? [])])) add(n, `${wsBase}/r/${encodeURIComponent(n)}/tty`, reachable ? reachable.has(n) : true);
  }
  setInterval(discover, 10000);

  // ---------------------------------------------------------------- sparklines
  // One sample per render tick, per metric, kept in the browser and
  // saved to localStorage so a reload keeps the last few minutes.
  const KEEP = 240;
  const series = new Map();
  try { for (const [k, v] of Object.entries(JSON.parse(localStorage.getItem("rw.series") || "{}"))) if (Array.isArray(v)) series.set(k, v.slice(-KEEP)); } catch { /* fresh */ }
  function sample(key, v) {
    const arr = series.get(key) ?? []; arr.push(v == null || Number.isNaN(v) ? null : v);
    if (arr.length > KEEP) arr.splice(0, arr.length - KEEP);
    series.set(key, arr);
  }
  setInterval(() => { try { localStorage.setItem("rw.series", JSON.stringify(Object.fromEntries(series))); } catch { /* quota or private */ } }, 10000);
  function spark(key, { w = 96, h = 22, max = null, min = 0, cls = "" } = {}) {
    const arr = series.get(key) ?? [];
    const vals = arr.filter((v) => v != null);
    if (vals.length < 2) return `<svg class="spark ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"></svg>`;
    let hi = max ?? Math.max(...vals), lo = min ?? Math.min(...vals);
    if (hi <= lo) hi = lo + 1;
    const x = (i) => (i / Math.max(1, arr.length - 1)) * w;
    const y = (v) => h - 1 - ((v - lo) / (hi - lo)) * (h - 2);
    let d = "", first = null, lastPt = null;
    arr.forEach((v, i) => { if (v == null) { d += " "; return; } const px = x(i).toFixed(1), py = y(v).toFixed(1); d += (d.endsWith(" ") || !d ? "M" : "L") + `${px},${py}`; if (!first) first = [px, py]; lastPt = [px, py]; });
    const area = first ? `${d} L${lastPt[0]},${h} L${first[0]},${h} Z` : "";
    return `<svg class="spark ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="area" d="${area}"/><path class="line" d="${d}"/><circle class="dot" cx="${lastPt[0]}" cy="${lastPt[1]}" r="1.8"/></svg>`;
  }

  // ---------------------------------------------------------------- render
  const nodes = new Map();
  const toggled = new Map(); // name -> collapsed, once the user has clicked
  const isCollapsed = (r, job) => toggled.has(r.name) ? toggled.get(r.name) : !job;
  function node(r) {
    let el = nodes.get(r.name);
    if (!el) {
      el = document.createElement("article"); el.className = "node"; nodes.set(r.name, el);
      el.addEventListener("click", (ev) => { if (!ev.target.closest(".tog")) return; toggled.set(r.name, !el.classList.contains("collapsed")); renderNode(r); });
    }
    return el;
  }
  const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

    }
    // Busy first, then idle, then the rest; name order within a group.
    const rank = { busy: 0, idle: 1, norunner: 2, stalled: 3, connecting: 4, off: 5 };
    const order = [...runners.values()].sort((a, b) => (rank[state(a)] - rank[state(b)]) || (HRANK[health(a).level] - HRANK[health(b).level]) || natural(a.name, b.name));
    if (view === "timeline") { try { renderGantt(order); } catch (e) { $("gantt").innerHTML = `<div class="err">${esc(e?.message ?? e)}</div>`; } }
    for (const r of order) {
      try { renderNode(r); } catch (e) { node(r).innerHTML = `<div class="row"><span class="name">${esc(r.name)}</span><span></span><span></span><span></span><span></span><span></span><span class="job none">render failed</span><span></span><span></span><span></span></div><div class="err">${esc(e?.message ?? e)}</div>`; }
      list.appendChild(node(r));
    }
    renderTiles(); renderTable();
  }
  window.rw = runners;
  setView(view);
  discover().then(render);
  setInterval(render, 1000);
})();
</script>
</body>
</html>
